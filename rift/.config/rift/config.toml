# AeroSpace-style settings for Rift 0.6.9.
# ~/.config/rift/config.toml is symlinked to this file.
# Launch at login is configured separately: rift service install; rift service start
# Stop AeroSpace before using Rift to avoid competing window managers/hotkeys.
# Rift normalizes its own layout trees; AeroSpace's normalization switches have
# no direct equivalents. Rift uses the current macOS keyboard layout (no preset).

[settings]
# Manage spaces immediately, as AeroSpace does.
default_disable = false
# Restart the Logitech Options+ agent after Rift starts, so its mouse shortcuts
# reconnect to Rift's workspace hotkeys.
run_on_start = ['/bin/sh -c "sleep 2; /bin/launchctl kickstart -k gui/$(/usr/bin/id -u)/com.logi.cp-dev-mgr"']
# AeroSpace's mouse-following callback is commented out.
focus_follows_mouse = false
mouse_follows_focus = false
mouse_hides_on_focus = false

[settings.layout]
# "stack" is the closest equivalent to AeroSpace's default accordion layout.
mode = "stack"
window_insertion_point = "next_to_selection"

[settings.layout.stack]
# Rift has no automatic orientation based on monitor dimensions.
# Horizontal matches AeroSpace on landscape monitors; use Alt+Ctrl+/ to rotate.
default_orientation = "horizontal"
stack_offset = 30.0

[settings.layout.gaps.outer]
top = 10
left = 10
bottom = 10
right = 10

[settings.layout.gaps.inner]
horizontal = 10
vertical = 10

[settings.ui.menu_bar]
active_label = "name"
display_style = "label"

[settings.gestures]
enabled = true
invert_horizontal_swipe = true
skip_empty = true

[virtual_workspaces]
default_workspace_count = 8
# Rift indices are zero-based: 0=1, 1=2, 2=3, 3=T, 4=W, 5=C, 6=M, 7=P.
default_workspace = 3
workspace_names = ["1", "2", "3", "T", "W", "C", "M", "P"]
app_rules = [
    { app_id = "com.github.wez.wezterm", workspace = "T" },
    { app_id = "com.mitchellh.ghostty", workspace = "T" },
    { app_id = "org.mozilla.firefox", title_regex = "work", workspace = "W" },
    { app_id = "org.mozilla.firefox", title_regex = "personal", workspace = "P" },
    { app_id = "com.tinyspeck.slackmacgap", workspace = "C" },
    { app_id = "com.spotify.client", workspace = "M" },
]

[keys]
# These select tiles/accordion. Unlike AeroSpace, repeating them does not rotate.
"Alt + Slash" = { set_workspace_layout = { mode = "traditional" } }
"Alt + Comma" = { set_workspace_layout = { mode = "stack" } }
"Alt + Ctrl + Slash" = "toggle_orientation"

"Alt + H" = { move_focus = "left" }
"Alt + J" = { move_focus = "down" }
"Alt + K" = { move_focus = "up" }
"Alt + L" = { move_focus = "right" }
"Alt + Shift + H" = { move_node = "left" }
"Alt + Shift + J" = { move_node = "down" }
"Alt + Shift + K" = { move_node = "up" }
"Alt + Shift + L" = { move_node = "right" }

# Rift resizes the nearest applicable split by 5%, not AeroSpace's 50 pixels.
"Alt + Shift + Minus" = { resize_window_shrink = "smart" }
"Alt + Shift + Equal" = { resize_window_grow = "smart" }

"Alt + 1" = { switch_to_workspace = 0 }
"Alt + 2" = { switch_to_workspace = 1 }
"Alt + 3" = { switch_to_workspace = 2 }
"Alt + T" = { switch_to_workspace = 3 }
"Alt + W" = { switch_to_workspace = 4 }
"Alt + C" = { switch_to_workspace = 5 }
"Alt + M" = { switch_to_workspace = 6 }
"Alt + P" = { switch_to_workspace = 7 }

"Alt + Shift + 1" = { move_window_to_workspace = { workspace = 0, follow = true } }
"Alt + Shift + 2" = { move_window_to_workspace = { workspace = 1, follow = true } }
"Alt + Shift + 3" = { move_window_to_workspace = { workspace = 2, follow = true } }
"Alt + Shift + T" = { move_window_to_workspace = { workspace = 3, follow = true } }
"Alt + Shift + W" = { move_window_to_workspace = { workspace = 4, follow = true } }
"Alt + Shift + C" = { move_window_to_workspace = { workspace = 5, follow = true } }
"Alt + Shift + M" = { move_window_to_workspace = { workspace = 6, follow = true } }
"Alt + Shift + P" = { move_window_to_workspace = { workspace = 7, follow = true } }

# Cycle nonempty workspaces on the focused display's current macOS space.
# Option-Tab goes left (previous); Option-Shift-Tab goes right (next).
"Alt + Tab" = { prev_workspace = true }
"Alt + Shift + Tab" = { next_workspace = true }
