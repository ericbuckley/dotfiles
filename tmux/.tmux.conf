set -g prefix C-a
unbind C-b

set-option -g default-shell $SHELL

set -g status-position top
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mouse off
set -g extended-keys-format csi-u
set -g extended-keys on

set -as terminal-features 'wezterm*:extkeys'
set -as terminal-features 'xterm-ghostty:extkeys'
# WezTerm defaults to TERM=xterm-256color unless configured otherwise.
set -as terminal-features 'xterm-256color:extkeys'
set-option -sa terminal-overrides ',xterm-256color:RGB'
set-option -sa terminal-overrides ',xterm-ghostty:RGB'
set-option -sa terminal-overrides ',alacritty:RGB'
set-option -sa terminal-overrides ',wezterm:RGB'

# Double tap <C-a> to go to the beginning of the line
bind C-a send-prefix
# Keep the standard detach key available with the custom prefix.
bind-key -T prefix d detach-client

# Plugins configuration
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'off'
set -g @tmux2k-theme 'gruvbox'
set -g @tmux2k-left-plugins 'session'
set -g @tmux2k-right-plugins 'mise'
set -g @tmux2k-time-format '%H:%M'
# Gruvbox dark colors for tmux popups and fzf-based plugins.
set -g popup-style 'bg=#282828,fg=#ebdbb2'
set -g popup-border-style 'bg=#282828,fg=#504945'
set-environment -g FZF_DEFAULT_OPTS '--color=bg:#282828,bg+:#3c3836,fg:#ebdbb2,fg+:#fbf1c7,hl:#fabd2f,hl+:#fe8019'
set -g @session_manager_key 'C-p'
set -g @session_manager_height '80%'
set -g @session_manager_width '80%'

# List of plugins
set -g @tpm_plugins '                     \
    tmux-plugins/tpm                      \
    tmux-plugins/tmux-sensible            \
    tmux-plugins/tmux-yank                \
    tmux-plugins/tmux-pain-control        \
    tmux-plugins/tmux-resurrect           \
    tmux-plugins/tmux-continuum           \
    vimlinuz/tmux-sm                      \
    2kabhishek/tmux2k                     \
    christoomey/vim-tmux-navigator        \
'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Confirm before manually restoring a saved tmux session
bind-key C-r confirm-before -p 'Restore tmux session? (y/n)' \
  "run-shell '~/.tmux/plugins/tmux-resurrect/scripts/restore.sh'"

## Popup shortcuts
##################
# Override the native default floating pane shortcut
bind * new-pane -x 50% -y 50% -X 25% -Y 25% -c "#{pane_current_path}"
# Open lazygit
bind C-g new-pane -x 80% -y 80% -X 10% -Y 10% -c "#{pane_current_path}" "lazygit"
